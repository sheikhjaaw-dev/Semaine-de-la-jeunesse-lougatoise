          const timer = setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
              setTime({
                days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                seconds: Math.floor((diff % (1000 * 60)) / 1000)

            <footer className="bg-brand-dark text-white py-10 border-t border-gray-800 text-center text-xs text-gray-400">
              <div className="flex items-center justify-center gap-3 mb-3">
                <img src={LOGO_OFFICIEL} alt="Logo Footer" className="h-8 w-auto bg-white p-1 rounded-lg" />
                <span className="font-heading font-bold text-sm text-white">Semaine de la Jeunesse Lougatoise • CEJ Louga</span>
              </div>
              <p className="mb-1">Contacts : {CONTACT_PHONES} | Email : {CONTACT_EMAIL}</p>
              <p>© 2026 Semaine de la Jeunesse Lougatoise. Fait avec passion pour Louga, Sénégal.</p>
            </footer>

            {/* Modals */}
            {modalProgram && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 text-brand-dark relative">
                  <button onClick={() => setModalProgram(null)} className="absolute top-4 right-4 text-gray-500 font-bold">✕</button>
                  <span className="text-[10px] font-bold bg-blue-100 text-brand-blue px-2.5 py-0.5 rounded-full">{modalProgram.category}</span>
                  <h3 className="font-heading font-bold text-xl mt-2">{modalProgram.title}</h3>
                  <p className="text-xs font-semibold text-brand-orange mt-2">🕒 {modalProgram.timeStr}</p>
                  <p className="text-xs font-semibold text-brand-dark mt-1">📍 {modalProgram.location}</p>
                  {modalProgram.speaker && <p className="text-xs text-gray-500 mt-1">👤 Responsables : {modalProgram.speaker}</p>}
                  <p className="text-xs text-brand-dark mt-4 leading-relaxed bg-brand-gray p-3 rounded-xl border border-gray-100">{modalProgram.description}</p>
                </div>
              </div>
            )}

            {lightboxIndex !== null && (
              <div onClick={() => setLightboxIndex(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                <div onClick={e => e.stopPropagation()} className="max-w-3xl w-full bg-brand-dark rounded-3xl overflow-hidden">
                  <img src={GALLERY_DATA[lightboxIndex].imageUrl} alt="Grand format" className="w-full max-h-[75vh] object-contain bg-black" />
                  <div className="p-4 text-white flex justify-between items-center">
                    <div>
                      <h4 className="font-heading font-bold text-base">{GALLERY_DATA[lightboxIndex].title}</h4>
                      <p className="text-xs text-gray-400">{GALLERY_DATA[lightboxIndex].location}</p>
                    </div>
                    <button onClick={() => setLightboxIndex(null)} className="bg-white/20 text-white px-4 py-1.5 rounded-xl text-xs font-bold">Fermer</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
